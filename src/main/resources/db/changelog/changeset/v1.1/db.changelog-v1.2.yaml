databaseChangeLog:
  - changeSet:
      id: add-activated-to-users
      author: nromanen
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: activated
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - update:
            tableName: users
            columns:
              - column:
                  name: activated
                  valueBoolean: true
            where: token IS NULL

  - changeSet:
      id: add-unique-teacher-full-name
      author: nromanen
      changes:
        - addUniqueConstraint:
            tableName: teachers
            columnNames: name, surname, patronymic
            constraintName: uk_teacher_full_name

  - changeSet:
      id: add-cascade-delete-semester-group
      author: d.plantus
      changes:
        - dropForeignKeyConstraint:
            baseTableName: semester_group
            constraintName: fkpf19s66cmi8qpqc0iaeigbrhh
        - addForeignKeyConstraint:
            baseTableName: semester_group
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_semester_group_group_id
            onDelete: CASCADE

  - changeSet:
      id: delete-temporary_schedule
      author: nromanen
      changes:
        - dropTable:
            tableName: temporary_schedule
            cascadeConstraints: true