spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/schedule}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 1
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:dummy}
            client-secret: ${FACEBOOK_CLIENT_SECRET:dummy}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://127.0.0.1:27017/schedules}
      database: ${MONGO_DB:schedules}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:m}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

openapi:
  server-url: localhost:8080/

# Hibernate
hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  show_sql: ${HIBERNATE_SHOW_SQL:false}
  hbm2ddl:
    auto: validate
  entity:
    package: com.softserve.entity

# Application
app:
  jwt:
    token:
      secret: ${JWT_SECRET:jwttoken}
      expired: ${JWT_EXPIRED:24h}
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080/}
  backend:
    url: ${BACKEND_URL:http://localhost:8080/}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}


  mail:
    #    sender: ${MAIL_SENDER:nromanen.softserveinc@gmail.com}
    sender: ${MAIL_SENDER:}
    enabled: ${MAIL_ENABLED:true}

# Redis
redis:
  address: ${REDIS_URL:redis://127.0.0.1:6379}

# Server
server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/}

# Logging
logging:
  level:
    com.softserve: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.springframework.security: WARN

